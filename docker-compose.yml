version: '3.8'

services:
  symphony-oracle:
    build: .
    container_name: symphony-oracle-voter
    restart: unless-stopped
    ports:
      - "19000:19000"  # Prometheus metrics endpoint
    env_file:
      - .env
    environment:
      # Override specific Docker-only settings if needed
      PYTHON_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: ${DEBUG:-false}
    volumes:
      # Optional: Mount for persistent data if needed
      - ./data:/symphony/data
      # RECOMMENDED: Mount symphonyd home to persist keyring and prevent temp file accumulation
      # Uncomment the line below for production deployments
      # - ./symphony_home:/symphony/.symphonyd
      # OPTIONAL: Mount cache directory to persist WASM cache across restarts
      # This reduces startup time and prevents re-compilation
      # - ./symphony_cache:/symphony/.cache
    networks:
      - symphony-network
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:19000/metrics >/dev/null 2>&1 && symphonyd status --home /symphony/.symphonyd >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  symphony-network:
    driver: bridge 